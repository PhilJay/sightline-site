name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    # Daily, so pages past their expires date go offline without a push.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Collect the published files
        run: |
          rsync -a ./ _site/ \
            --exclude='.*' --exclude='/_site' --exclude='/_pages' --exclude='/design' \
            --exclude='/build.py' --exclude='/build.sh' --exclude='/*.md'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
