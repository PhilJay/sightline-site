<!doctype html>
<!-- Template for the share images of pages in _pages/. Render it with design/share-image.sh, which passes title, eyebrow and image in the URL. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightline share image</title>
<style>
@font-face { font-family: Manrope; font-weight: 500 800; src: url(../assets/manrope-latin.woff2) format('woff2'); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative;
  font-family: Manrope, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(45% 70% at 12% 0%, rgba(60, 201, 198, 0.42), rgba(60, 201, 198, 0) 70%),
    radial-gradient(45% 70% at 100% 100%, rgba(91, 140, 255, 0.36), rgba(91, 140, 255, 0) 70%),
    linear-gradient(160deg, #0d2a30 0%, #081b20 55%, #0a1626 100%);
}
.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 48px 48px;
  -webkit-mask: radial-gradient(70% 80% at 30% 40%, #000 15%, transparent 80%);
}
.text { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 500px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.brand img { width: 48px; height: 48px; }
.eyebrow {
  align-self: flex-start;
  margin-top: auto;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.18);
}
.eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #9ff0e6; box-shadow: 0 0 12px #9ff0e6; }
h1 {
  margin: 22px 0 auto;
  font-size: 54px;
  line-height: 1.06;
  font-weight: 800;
  letter-spacing: -1.6px;
  background: linear-gradient(120deg, #fff 45%, #9ff0e6 85%, #b9c9ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  padding-bottom: 0.08em;
}
.url { font-size: 18px; font-weight: 700; color: #7fdfe0; }
.shot {
  position: absolute;
  left: 620px;
  top: 92px;
  width: 700px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16), 0 40px 90px rgba(0, 8, 12, 0.6), 0 12px 30px rgba(0, 8, 12, 0.35);
}
.shot img { display: block; width: 100%; height: auto; }
.glow {
  position: absolute;
  left: 640px;
  top: 120px;
  width: 620px;
  height: 420px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(60, 201, 198, 0.35), rgba(60, 201, 198, 0));
  filter: blur(30px);
}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="shot"><img id="image" alt=""></div>
  <div class="text">
    <div class="brand"><img src="../assets/icon.png" alt="">Sightline</div>
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="title"></h1>
    <span class="url">sightlinemac.com</span>
  </div>
<script>
var params = new URLSearchParams(location.search);
document.getElementById('title').textContent = params.get('title');
document.getElementById('eyebrow').textContent = params.get('eyebrow');
document.getElementById('image').src = '../' + params.get('image').replace(/^\//, '');
</script>
</body>
</html>
